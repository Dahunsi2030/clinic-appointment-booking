# CI for Clinic Appointment Booking
#
# Generated by Blacksmith. You own this file — customize as needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # The test suite builds its database from schema.prisma, so the client
      # has to exist before vitest starts.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # src/api/generated/ is git-ignored, so the typed client is rebuilt from
      # the backend schema before the frontend is type-checked or built.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        working-directory: backend

      # Exporting the schema imports the route modules, which need the
      # generated client. Explicit rather than relying on Prisma's postinstall,
      # which does not run under `npm ci --ignore-scripts`.
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Export OpenAPI schema
        run: npm run openapi -- ../frontend/_schema.json
        working-directory: backend

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate API client
        run: npx openapi-ts --input _schema.json --output src/api/generated

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
